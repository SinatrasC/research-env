[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "research-env"
version = "0.1.0"
description = "Passive CLI contract for environment-backed research instruments."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.2",
]

[project.scripts]
research-env = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli", "envelope", "modes", "provenance", "spec"]
packages = ["adapters"]

[dependency-groups]
dev = [
    "ruff>=0.14.6",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I"]
