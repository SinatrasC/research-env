[project]
name = "mini-calendar"
version = "0.1.0"
description = "Calendar-booking tasks in the General Agent shape (DB, stateful tools, gold actions, verify) as a verifiers v1 taskset."
requires-python = ">=3.11"
dependencies = ["verifiers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mini_calendar"]
